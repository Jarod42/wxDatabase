name: msys2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/msys2.yml'
      - '**.cpp'
      - '**.h'
      - '**.cmake'
      - 'CMakeLists.txt'
  pull_request:
    paths:
      - '.github/workflows/msys2.yml'
      - '**.cpp'
      - '**.h'
      - '**.cmake'
      - 'CMakeLists.txt'
jobs:
  msys2:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        wx-version: ['3.2']

    steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: clang64
        update: true
        install: >-
          mingw-w64-clang-x86_64-cmake
          mingw-w64-clang-x86_64-make
          mingw-w64-clang-x86_64-clang
          mingw-w64-clang-x86_64-clang-tools-extra
          mingw-w64-clang-x86_64-sqlite3
          mingw-w64-clang-x86_64-libmariadbclient

    # WxWidgets
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: wxWidgets/wxWidgets
        ref: ${{matrix.wx-version}}
        submodules: recursive
        path: wxWidgets

    - name: build and install wxWidgets
      shell: msys2 {0}
      run: |
        mkdir wxWidgets/build-release
        cd wxWidgets/build-release
        cmake .. -G"MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release -DwxBUILD_DEBUG_LEVEL=0 -DwxBUILD_MONOLITHIC=1 -DwxBUILD_SAMPLES=SOME -DwxUSE_STL=1
        make -j$(nproc) && make install

    # wxDatabase
    - name: Checkout
      uses: actions/checkout@v4

    - name: build wxDatabase
      shell: msys2 {0}
      run: |
        cmake -S . -B build -G"MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release -DENABLE_MYSQL=1 -DENABLE_SQLITE=1 -DENABLE_PGS=1 -DENABLE_TDS=0 -DENABLE_ODBC=0 -DBUILD_SAMPLE=1
        cmake --build build -j $(nproc)
